<!doctype html>
<!-- 담당: 팀원 D · 이슈 #14 · 명세: F12 (화면 배치). 스크립트는 HTML 안에 직접 쓰지 않고 .js 파일에 둔다 (MV3 제한) -->
<!-- 칸마다 그리는 파일이 하나씩 정해져 있다. 각 파일은 자기 칸 안만 그린다 (docs/file-structure.md 12번) -->
<!-- 칸 안의 내용(폴더·북마크·목록)은 담당 .js가 채운다. 여기서는 빈 칸만 둔다. 모양은 확정 시안(docs/design/App.tsx) -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>바로링크 · 새 탭</title>
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <!-- 배경 장식 (은은한 번짐). 공통 자산이라 뼈대에 둔다 -->
    <div class="bg-decor" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- 아이콘 모음 (SVG 심볼). 외부 파일을 쓰지 않고 안에서 정의한다. ui.js의 icon()이 <use href="#i-..."/>로 쓴다 -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <g id="i-bookmark"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-3.5L6 21V4.5Z" /></g>
        <g id="i-search"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m16 16 4 4" /></g>
        <g id="i-sparkles"><path d="m12 3 1.1 3 2.9 1.5-2.9 1.4L12 12l-1.1-3.1L8 7.5 10.9 6 12 3Z" /></g>
        <g id="i-clock"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3.5 2" /></g>
        <g id="i-folder"><path d="M3.5 7A2 2 0 0 1 5.5 5h4l2 2h7A2 2 0 0 1 20.5 9v8.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V7Z" /></g>
        <g id="i-grid"><rect x="4" y="4" width="6" height="6" rx="1.5" /><rect x="14" y="4" width="6" height="6" rx="1.5" /><rect x="4" y="14" width="6" height="6" rx="1.5" /><rect x="14" y="14" width="6" height="6" rx="1.5" /></g>
        <g id="i-history"><path d="M4 6v5h5" /><path d="M5.8 17.5A8.5 8.5 0 1 0 4 11" /><path d="M12 7.5V12l3 2" /></g>
        <g id="i-close"><path d="m7 7 10 10M17 7 7 17" /></g>
        <g id="i-chevron"><path d="m9 18 6-6-6-6" /></g>
        <g id="i-arrow"><path d="m14 6 6 6-6 6M20 12H4" /></g>
        <g id="i-plus"><path d="M12 5v14M5 12h14" /></g>
        <g id="i-check"><path d="m5 12.5 4.5 4.5L19 7.5" /></g>
      </defs>
    </svg>

    <!-- 뼈대 확인용 문구. render.js가 화면을 그리기 시작하면 지운다 -->
    <p id="skeleton-note">바로링크 (BaroLink) · 뼈대만 있는 상태입니다</p>

    <div class="app">
      <header id="header"></header>                     <!-- render.js: 로고, 이동 버튼, [정리하기], 정리 기록 -->
      <div class="content">
        <main id="app-main">
          <section id="web-search"></section>           <!-- render.js (search.js 사용): 날짜, 웹 검색창 -->
          <section id="organize-suggestion"></section>  <!-- view/cards.js: 첫 정리 카드, 고정 제안 카드 -->
          <section id="my-folders" class="card">        <!-- 내 폴더 구역. 아래 두 칸이 한 줄로 이어진다 -->
            <div class="folders-row">
              <div id="folder-list"></div>              <!-- view/folders.js: 내 폴더 줄 -->
              <div id="forgotten-slot"></div>           <!-- view/forgottenFolder.js: 잊고 있던 북마크 (폴더 줄 끝) -->
            </div>
          </section>
          <section id="all-bookmarks" class="card"></section> <!-- render.js (search.js 사용): 북마크 검색창, 모든 북마크 -->
        </main>
      </div>
    </div>

    <nav id="dock" aria-label="고정 북마크"></nav>       <!-- render.js: 고정됨(독) -->
    <div id="notice"></div>                             <!-- view/history.js: 정리 결과 안내 -->
    <div id="toast" role="status" aria-live="polite"></div> <!-- ui.js: 짧은 안내 문구 -->
    <div id="dialogs"></div>                            <!-- 각 화면 파일이 자기 <dialog>를 여기에 붙인다 -->

    <script type="module" src="js/render.js"></script>
  </body>
</html>
