<!doctype html>
<!-- 담당: 팀원 D · 이슈 #14 · 명세: F12 (화면 배치). 스크립트는 HTML 안에 직접 쓰지 않고 .js 파일에 둔다 (MV3 제한) -->
<!-- 칸마다 그리는 파일이 하나씩 정해져 있다. 각 파일은 자기 칸 안만 그린다 (docs/file-structure.md 12번) -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>새 탭</title>
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <!-- 뼈대 확인용 문구. 화면을 만들기 시작하면 지운다 -->
    <p id="skeleton-note">바로링크 (BaroLink) · 뼈대만 있는 상태입니다</p>

    <header id="header"></header>                       <!-- render.js: 이동 버튼, [정리하기], 정리 기록 -->
    <main id="app">
      <section id="web-search"></section>               <!-- render.js (search.js 사용): 날짜, 웹 검색창 -->
      <section id="organize-suggestion"></section>      <!-- view/cards.js: 첫 정리 카드, 고정 제안 카드 -->
      <section id="my-folders">                         <!-- 내 폴더 구역. 아래 두 칸이 한 줄로 이어진다 -->
        <div id="forgotten-slot"></div>                 <!-- view/forgottenFolder.js: 잊고 있던 북마크 카드 (맨 앞) -->
        <div id="folder-list"></div>                    <!-- view/folders.js: 내 폴더 줄 -->
      </section>
      <section id="all-bookmarks"></section>            <!-- render.js (search.js 사용): 북마크 검색창, 모든 북마크 -->
    </main>
    <div id="dock"></div>                               <!-- render.js: 고정됨 -->
    <div id="notice"></div>                             <!-- view/history.js: 정리 결과 안내 -->
    <div id="toast"></div>                              <!-- ui.js: 짧은 안내 문구 -->
    <div id="dialogs"></div>                            <!-- 각 화면 파일이 자기 <dialog>를 여기에 붙인다 -->

    <script type="module" src="js/render.js"></script>
  </body>
</html>
